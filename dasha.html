<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Bekerja Sayang</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Outfit', sans-serif;
            color: white;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .dasha-img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            animation: jedagJedugBg 0.35s infinite alternate ease-in-out;
            filter: brightness(0.6) contrast(1.2);
            z-index: 1;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.8) 100%);
            z-index: 5;
        }

        .text-container {
            position: relative;
            z-index: 10;
            text-align: center;
            animation: jedagJedugText 0.35s infinite alternate ease-in-out;
        }

        h1 {
            color: #fff;
            font-size: 5vw;
            line-height: 1.2;
            text-transform: uppercase;
            margin: 0;
            padding: 0 20px;
            text-shadow: 
                0 0 10px #ff0055,
                0 0 20px #ff0055,
                0 0 40px #ff0055,
                0 0 80px #ff0055;
        }

        .sayang {
            color: #00f0ff;
            text-shadow: 
                0 0 10px #00f0ff,
                0 0 20px #00f0ff,
                0 0 40px #00f0ff,
                0 0 80px #00f0ff;
            font-size: 7vw;
        }

        @keyframes jedagJedugBg {
            0% { transform: scale(1); filter: brightness(0.5) contrast(1.2) saturate(1); }
            100% { transform: scale(1.15) rotate(1deg); filter: brightness(0.8) contrast(1.4) saturate(1.5); }
        }

        @keyframes jedagJedugText {
            0% { transform: scale(1) translateY(0); }
            100% { transform: scale(1.15) translateY(-10px); }
        }

        /* UI Upload */
        .upload-container {
            position: absolute;
            z-index: 100;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 12px 25px;
            border-radius: 30px;
            border: 2px solid #00f0ff;
            text-align: center;
            box-shadow: 0 0 15px #00f0ff;
            transition: all 0.3s;
        }
        
        .upload-container:hover {
            background: rgba(0,240,255,0.2);
            transform: translateX(-50%) scale(1.05);
        }

        .upload-container input {
            display: none;
        }

        .upload-container label {
            cursor: pointer;
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
    </style>
</head>
<body>
    
    <!-- Tombol buat masukin foto gampang dari dalam webnya langsung -->
    <div class="upload-container">
        <label for="fotoUpload">📸 GANTI FOTO DISINI</label>
        <input type="file" id="fotoUpload" accept="image/*">
    </div>

    <div class="container">
        <!-- Default gambar (fallback online) -->
        <img id="bgImg" src="https://i.pinimg.com/736x/8f/3e/26/8f3e2646279f00d283f3e1f5ecb822d6.jpg" alt="Background" class="dasha-img">
        
        <div class="overlay"></div>
        
        <div class="text-container">
            <h1>Selamat Bekerja<br><span class="sayang">Sayaaang</span></h1>
        </div>
    </div>

    <script>
        // Logika untuk mengganti foto secara langsung
        document.getElementById('fotoUpload').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('bgImg').src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
